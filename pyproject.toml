[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguide"
version = "0.1.0"
description = "CLI tool that analyzes a code repository and explains it to newcomer developers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "google-genai>=2.0.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
    "vulture>=2.14",
]

[project.scripts]
codeguide = "codeguide.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codeguide = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = [
    "S101", # Allow assert in pytest
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
