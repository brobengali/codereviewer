# Secret detection rules and never-read file patterns (External Data File)
version = "1.0.0"

[file_denylist]
never_read_patterns = [
    ".env*",
    "*.env",
    "*.pem",
    "*.key",
    "*.pkcs12",
    "*.pfx",
    "*.p12",
    "id_rsa*",
    "id_ecdsa*",
    "id_ed25519*",
    "*.kdbx",
    "*.keystore",
    "*.jks",
    "*.crt",
    "*.der"
]

[entropy]
enabled = true
threshold = 4.3
min_length = 20
max_length = 120
placeholder = "[REDACTED:high_entropy]"

[[rules]]
id = "private_key"
name = "Private Key"
regex = '''(?s)-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----'''
placeholder = "[REDACTED:private_key]"

[[rules]]
id = "aws_key"
name = "AWS Access Key"
regex = '''\b(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}\b'''
placeholder = "[REDACTED:aws_key]"

[[rules]]
id = "connection_string"
name = "Database Connection String"
regex = '''(?i)\b(?:postgres|postgresql|mysql|mongodb|redis|amqp|mssql|oracle|sqlite)://[a-zA-Z0-9_.\-]+:[^@\s"']+@[a-zA-Z0-9_.\-]+(?::\d+)?(?:/[^\s"']*)?'''
placeholder = "[REDACTED:connection_string]"

[[rules]]
id = "url_credentials"
name = "URL with Basic Credentials"
regex = '''(?i)\bhttps?://[a-zA-Z0-9_.\-]+:[^@\s"']+@[a-zA-Z0-9_.\-]+(?::\d+)?(?:/[^\s"']*)?'''
placeholder = "[REDACTED:url_credentials]"

[[rules]]
id = "github_token"
name = "GitHub Token"
regex = '''\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36,255}\b'''
placeholder = "[REDACTED:github_token]"

[[rules]]
id = "slack_token"
name = "Slack Token"
regex = '''\bxox[baprs]-[0-9a-zA-Z]{10,48}\b'''
placeholder = "[REDACTED:slack_token]"

[[rules]]
id = "jwt_token"
name = "JSON Web Token"
regex = '''\bey[A-Za-z0-9_-]{10,}\.ey[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'''
placeholder = "[REDACTED:jwt_token]"

[[rules]]
id = "api_key"
name = "Generic Key Assignment"
regex = '''(?i)(?:api_key|apikey|secret|token|password|auth|bearer)[\s:=]+["']?([a-zA-Z0-9_\-\.]{12,})["']?'''
capture_group = 1
placeholder = "[REDACTED:api_key]"
